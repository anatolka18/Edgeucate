version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    build:
      context: .
      dockerfile: Dockerfile.redis
    container_name: edgeucate-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    logging: *default-logging
    networks:
      - backend

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: edgeucate-server-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - CHOKIDAR_INTERVAL=1000
    volumes:
      - ./server:/app
      - /app/node_modules
    logging: *default-logging
    networks:
      - backend
    depends_on:
      - redis

  bull-board:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: edgeucate-bullboard-dev
    restart: unless-stopped
    ports:
      - "4201:4201"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=development
    command: npx ts-node src/queue/bull-board-server.ts
    volumes:
      - ./server:/app
      - /app/node_modules
    logging: *default-logging
    networks:
      - backend
    depends_on:
      - redis

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: edgeucate-client-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      - VITE_PROXY_TARGET=http://server:4200
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - ./client/index.html:/app/index.html
      - ./client/vite.config.ts:/app/vite.config.ts
    depends_on:
      server:
        condition: service_started
    logging: *default-logging
    networks:
      - frontend
      - backend

volumes:
  redis_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge