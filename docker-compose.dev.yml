version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: edgeucate-server-dev
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./server:/app
      - /app/node_modules
    logging: *default-logging
    networks:
      - backend

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: edgeucate-client-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      - VITE_PROXY_TARGET=http://server:4200
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - ./client/index.html:/app/index.html
      - ./client/vite.config.ts:/app/vite.config.ts
    depends_on:
      server:
        condition: service_started
    logging: *default-logging
    networks:
      - frontend
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge