global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'edgeucate-server'
    metrics_path: '/api/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['server:4200']
        labels:
          service: 'edgeucate-backend'
          environment: 'production'

  - job_name: 'trivy-monitor'
    honor_labels: true
    scrape_interval: 60s
    static_configs:
      - targets: ['pushgateway:9091']
        labels:
          service: 'pushgateway'
          environment: 'production'