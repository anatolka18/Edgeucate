# ========================================
# Coturn TURN/STUN Server Configuration
# ========================================

listening-port=3478
tls-listening-port=5349

listening-ip=0.0.0.0

external-ip=46.21.83.58

# ========================================
# Аутентификация и безопасность
# ========================================

fingerprint

lt-cred-mech

realm=edgeucate.space
server-name=edgeucate.space

# ========================================
# TLS сертификаты (Let's Encrypt)
# ========================================

cert=/etc/letsencrypt/live/edgeucate.space/fullchain.pem
pkey=/etc/letsencrypt/live/edgeucate.space/privkey.pem

# ========================================
# Безопасность
# ========================================

no-loopback-peers

no-multicast-peers

no-cli

stale-nonce=600

# ========================================
# Диапазон портов для relay медиа-трафика
# ========================================

min-port=49152
max-port=65535

# ========================================
# Логирование
# ========================================

log-file=stdout
verbose