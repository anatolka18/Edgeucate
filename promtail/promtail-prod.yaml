server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576
    timeout: 10s

scrape_configs:
  - job_name: docker-app
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.edgeucate.service"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/edgeucate-(loki|promtail|prometheus|grafana)-prod'
        action: drop
      
      - source_labels: ['__meta_docker_container_name']
        regex: '/edgeucate-(server|redis|client|minio|coturn|mongo-backup)-prod'
        action: keep
      
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_edgeucate_service']
        target_label: 'app_tier'
    
    pipeline_stages:
      - docker: {}
      
      - match:
          selector: '{container="edgeucate-client-prod"}'
          stages:
            - drop:
                expression: '.*open\(\) ".*/favicon\.ico" failed.*'
            - drop:
                expression: '.*open\(\) ".*/[a-zA-Z0-9_-]+\.(js|css|map|png|jpg|jpeg|svg|gif|ico|txt|woff2?|ttf|eot|html)" failed.*'
            - drop:
                expression: '.*open\(\) ".*/(assets|static|Public)/.*" failed.*'
            
            - regex:
                expression: '.*\[(?P<nginx_level>emerg|alert|crit|error|warn|notice|info|debug)\].*'
            - template:
                source: level
                template: '{{ if or (eq .nginx_level "error") (eq .nginx_level "crit") (eq .nginx_level "alert") (eq .nginx_level "emerg") }}error{{ else if eq .nginx_level "warn" }}warn{{ else }}info{{ end }}'
            - labels:
                level:
      
      - match:
          selector: '{container="edgeucate-server-prod"}'
          stages:
            - drop:
                expression: '.*"message":"Cannot (GET|POST) /api/(\.env|graphql|gql|wp-admin|wp-login|\.git|env|\.well-known|php|\.php)"'
            - drop:
                expression: '.*"message":"Refresh token not found"'
            - drop:
                expression: '.*"status":401.*"message":"Unauthorized"'

      - match:
          selector: '{container="edgeucate-server-prod"}'
          stages:
            - json:
                expressions:
                  level: level
                  message: message
                  path: path
                  status: status
                  context: context
            - labels:
                level:
      
      - match:
          selector: '{container="edgeucate-server-prod", level=""}'
          stages:
            - regex:
                expression: '(?P<nest_level>ERROR|WARN|LOG|DEBUG|VERBOSE)'
            - template:
                source: level
                template: '{{ if eq .nest_level "LOG" }}info{{ else if eq .nest_level "VERBOSE" }}info{{ else }}{{ .nest_level | lower }}{{ end }}'
            - labels:
                level:
      
      - match:
          selector: '{container=~"edgeucate-(redis|minio|coturn|mongo-backup)-prod"}'
          stages:
            - drop:
                expression: '.*'
      
      - match:
          selector: '{level=""}'
          stages:
            - template:
                source: level
                template: 'info'
            - labels:
                level:
      
      - timestamp:
          source: time
          format: RFC3339Nano
      
      - labels:
          container:
          service:
          app_tier:
      
      - output:
          source: log