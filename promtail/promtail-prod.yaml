server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576
    timeout: 10s

scrape_configs:
  - job_name: docker-app
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.edgeucate.service"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/edgeucate-(loki|promtail|prometheus|grafana)-prod'
        action: drop
      
      - source_labels: ['__meta_docker_container_name']
        regex: '/edgeucate-(server|redis|client|minio|coturn|mongo-backup)-prod'
        action: keep
      
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_edgeucate_service']
        target_label: 'app_tier'
    
    pipeline_stages:
      - docker: {}
      
      - match:
          selector: '{container="edgeucate-server-prod"}'
          stages:
            - json:
                expressions:
                  level: level
                  message: message
                  path: path
                  status: status
                  context: context
            - labels:
                level:
      
      - match:
          selector: '{container="edgeucate-server-prod", level=""}'
          stages:
            - regex:
                expression: '(?P<nest_level>ERROR|WARN|LOG|DEBUG|VERBOSE)'
            - template:
                source: level
                template: '{{ if eq .nest_level "LOG" }}info{{ else if eq .nest_level "VERBOSE" }}info{{ else }}{{ .nest_level | lower }}{{ end }}'
            - labels:
                level:
      
      - match:
          selector: '{container!="edgeucate-server-prod"}'
          stages:
            - logfmt:
                mapping:
                  level:
                  msg:
            - labels:
                level:
      
      - match:
          selector: '{level=""}'
          stages:
            - template:
                source: level
                template: 'info'
            - labels:
                level:
      
      - timestamp:
          source: time
          format: RFC3339Nano
      
      - labels:
          container:
          service:
          app_tier:
      
      - output:
          source: log