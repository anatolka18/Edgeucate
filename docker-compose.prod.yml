version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    image: edgeucate-server:${VERSION:-latest}
    container_name: edgeucate-server-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4200/api', (res) => { process.exit(res.statusCode < 400 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    logging: *default-logging
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    labels:
      - "com.edgeucate.service=backend"
      - "com.edgeucate.version=${VERSION:-1.0.0}"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    image: edgeucate-client:${VERSION:-latest}
    container_name: edgeucate-client-prod
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    labels:
      - "com.edgeucate.service=frontend"
      - "com.edgeucate.version=${VERSION:-1.0.0}"

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    # internal: true