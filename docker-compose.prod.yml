x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    build:
      context: .
      dockerfile: Dockerfile.redis
    container_name: edgeucate-redis-prod
    restart: unless-stopped
    volumes:
      - redis_data:/data
    logging: *default-logging
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    image: edgeucate-server:${VERSION:-latest}
    container_name: edgeucate-server-prod
    restart: unless-stopped
    env_file:
      - /opt/edgeucate-secrets/.env.prod
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4200/api/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    labels:
      - "com.edgeucate.service=backend"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    image: edgeucate-client:${VERSION:-latest}
    container_name: edgeucate-client-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    labels:
      - "com.edgeucate.service=frontend"

  coturn:
    image: coturn/coturn:4.6.2
    container_name: edgeucate-coturn-prod
    restart: unless-stopped
    network_mode: host
    env_file:
      - /opt/edgeucate-secrets/.env.prod
    volumes:
      - ./coturn/turnserver.conf:/etc/turnserver.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      - TURN_USERNAME=${TURN_USERNAME}
      - TURN_PASSWORD=${TURN_PASSWORD}
    command: ["-c", "/etc/turnserver.conf", "--user=${TURN_USERNAME}:${TURN_PASSWORD}"]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 64M
    labels:
      - "com.edgeucate.service=coturn"

  minio:
    image: minio/minio:latest
    container_name: edgeucate-minio-prod
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    labels:
      - "com.edgeucate.service=storage"
    logging: *default-logging

  mongo-backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: edgeucate-mongo-backup:${VERSION:-latest}
    container_name: edgeucate-mongo-backup-prod
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - /opt/edgeucate-secrets/.env.prod
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - backup_logs:/var/log
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 64M
    labels:
      - "com.edgeucate.service=backup"
    logging: *default-logging

volumes:
  redis_data:
  minio_data:
  backup_logs:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge