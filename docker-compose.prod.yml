x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    build:
      context: .
      dockerfile: Dockerfile.redis
    container_name: edgeucate-redis-prod
    restart: unless-stopped
    volumes:
      - redis_data:/data
    logging: *default-logging
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    image: edgeucate-server:${VERSION:-latest}
    container_name: edgeucate-server-prod
    restart: unless-stopped
    env_file:
      - /opt/edgeucate-secrets/.env.prod
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
      - MINIO_ENDPOINT=http://minio:9000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4200/api/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    labels:
      - "com.edgeucate.service=backend"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    image: edgeucate-client:${VERSION:-latest}
    container_name: edgeucate-client-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    labels:
      - "com.edgeucate.service=frontend"

  coturn:
    image: coturn/coturn:4.6.2
    container_name: edgeucate-coturn-prod
    restart: unless-stopped
    network_mode: host
    env_file:
      - /opt/edgeucate-secrets/.env.prod
    volumes:
      - ./coturn/turnserver.conf:/etc/turnserver.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      - TURN_USERNAME=${TURN_USERNAME}
      - TURN_PASSWORD=${TURN_PASSWORD}
    command: ["-c", "/etc/turnserver.conf", "--user=${TURN_USERNAME}:${TURN_PASSWORD}"]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 64M
    labels:
      - "com.edgeucate.service=coturn"

  minio:
    image: minio/minio:latest
    container_name: edgeucate-minio-prod
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    labels:
      - "com.edgeucate.service=storage"
    logging: *default-logging

  prometheus:
    image: prom/prometheus:latest
    container_name: edgeucate-prometheus-prod
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    logging: *default-logging
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    labels:
      - "com.edgeucate.service=monitoring"

  loki:
    image: grafana/loki:latest
    container_name: edgeucate-loki-prod
    restart: unless-stopped
    volumes:
      - ./loki/loki-prod.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    logging: *default-logging
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M
    labels:
      - "com.edgeucate.service=monitoring"

  promtail:
    image: grafana/promtail:latest
    container_name: edgeucate-promtail-prod
    restart: unless-stopped
    privileged: true
    volumes:
      - ./promtail/promtail-prod.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yaml
    logging: *default-logging
    networks:
      - backend
    depends_on:
      loki:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 128M
    labels:
      - "com.edgeucate.service=monitoring"

  grafana:
    image: grafana/grafana:latest
    container_name: edgeucate-grafana-prod
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.edgeucate.space
      - GF_SERVER_DOMAIN=grafana.edgeucate.space
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=lax
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY=true
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY_MAX_AGE_SECONDS=31536000
      - GF_PATHS_CONFIG=/etc/grafana/custom.ini
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/custom.ini:/etc/grafana/custom.ini:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    labels:
      - "com.edgeucate.service=monitoring"

  mongo-backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: edgeucate-mongo-backup:${VERSION:-latest}
    container_name: edgeucate-mongo-backup-prod
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - /opt/edgeucate-secrets/.env.prod
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - backup_logs:/var/log
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 64M
    labels:
      - "com.edgeucate.service=backup"
    logging: *default-logging

volumes:
  redis_data:
  minio_data:
  backup_logs:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge