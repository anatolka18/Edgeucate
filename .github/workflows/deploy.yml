name: CD - Deploy to VPS

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/Edgeucate
            
            git stash || true
            
            git pull

            git stash pop || true
            
            git checkout --ours docker-compose.prod.yml server/Dockerfile.prod || true
            
            git add . || true
            git stash drop || true
            
            docker compose -f docker-compose.prod.yml up -d --build

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sleep 15
            curl -sf http://localhost:80/api/ > /dev/null && echo "Deploy successful" || exit 1