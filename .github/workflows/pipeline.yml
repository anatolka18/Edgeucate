name: Pipeline

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-and-scan:
    name: CI - Build and Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SOPS
        run: |
          curl -LO https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64
          sudo mv sops-v3.13.2.linux.amd64 /usr/local/bin/sops
          sudo chmod +x /usr/local/bin/sops
          sops --version

      - name: Install age
        run: |
          AGE_VERSION="1.2.1"
          curl -L "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz" -o /tmp/age.tar.gz
          tar -xzf /tmp/age.tar.gz -C /tmp
          sudo mv /tmp/age/age /usr/local/bin/
          sudo mv /tmp/age/age-keygen /usr/local/bin/
          sudo chmod +x /usr/local/bin/age /usr/local/bin/age-keygen
          age --version

      - name: Decrypt secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          sops --decrypt --input-type dotenv --output-type dotenv .env.prod.enc > .env.prod
          echo "Secrets decrypted successfully"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        run: docker compose -f docker-compose.prod.yml build server

      - name: Build client image
        run: docker compose -f docker-compose.prod.yml build client

      - name: Scan server image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'edgeucate-server:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Scan client image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'edgeucate-client:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload decrypted env
        uses: actions/upload-artifact@v4
        with:
          name: prod-secrets
          path: .env.prod
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: CD - Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download decrypted env
        uses: actions/download-artifact@v4
        with:
          name: prod-secrets

      - name: Copy secrets to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".env.prod"
          target: "/tmp/"

      - name: Deploy secrets
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            sudo mkdir -p /opt/edgeucate-secrets
            sudo mv /tmp/.env.prod /opt/edgeucate-secrets/.env.prod
            sudo chown deploy:deploy /opt/edgeucate-secrets/.env.prod
            sudo chmod 600 /opt/edgeucate-secrets/.env.prod
            echo "Secrets deployed"

      - name: Pull latest code
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            cd ~/Edgeucate
            git fetch origin dev
            git reset --hard origin/dev
            echo "Code updated: $(git rev-parse --short HEAD)"

      - name: Build images on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            cd ~/Edgeucate
            docker compose -f docker-compose.prod.yml --env-file /opt/edgeucate-secrets/.env.prod build --parallel

      - name: Start services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            cd ~/Edgeucate
            docker compose -f docker-compose.prod.yml --env-file /opt/edgeucate-secrets/.env.prod up -d
            sleep 20
            docker compose -f docker-compose.prod.yml --env-file /opt/edgeucate-secrets/.env.prod ps

      - name: Init MinIO buckets
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            docker exec edgeucate-mongo-backup-prod /usr/local/bin/init-minio.sh || echo "MinIO init skipped"