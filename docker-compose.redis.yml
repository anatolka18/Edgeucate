version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    build:
      context: ./
      dockerfile: Dockerfile.redis
    container_name: edgeucate-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    logging: *default-logging
    networks:
      - backend

volumes:
  redis_data:

networks:
  backend:
    driver: bridge